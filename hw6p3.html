<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Homework 6 - Part 3</title>
  <meta name="description" content="Homework 6 for the CNIT 133 JavaScript course at CCSF">

  <link rel="stylesheet" href="styles.css">

  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>

  <style>
    .form {
      justify-items: start;
      line-height: 4px;
    }
  </style>
  <script>
  const phoneNumberRegex = /^\([0-9]{3}\) [0-9]{3}-[0-9]{4}$/;
    $(document).ready(function () {
      $("#submit").click(function () {
        $("#output")
          .hide()
          .fadeTo("slow", 1);
        const phoneNumber = $("#phone-number").val();
        console.log(phoneNumber);
        if (!phoneNumberRegex.test(phoneNumber)) {
          $("#output").html("The phone number is formatted improperly. The correct format is (XXX) XXX-XXXX.");
          return;
        }
        $("#output").html("Thank you for providing your telephone number. An agent will contact you in the future.");
      });
      $("#clear").click(function () {
        $("#phone-number").val("");
        $("#output").html("");
      });
    });
  </script>
</head>

<body>
  <h1>Homework 6 - Part 3</h1>

  <a href="hw6.html">Back</a>
  <div class="form">
    <input id="phone-number" type="text" placeholder="Phone number">
  </div>
  <button id="submit">Submit</button>
  <button id="clear">Clear</button>
  <div id="output"></div>

</body>

</html>
