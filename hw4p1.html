<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Homework 4 - Part 1</title>
  <meta name="description" content="Homework 4 for the CNIT 133 JavaScript course at CCSF">

  <link rel="stylesheet" href="styles.css">

  <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.2/themes/base/jquery-ui.css">
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.js"></script>

  <style>
  #draggable { height: 150px; padding: 0.5em; }
  </style>
  <script>
    $(function () {
      $("#draggable").draggable();
    });
    $(document).ready(function () {
      let min = 5;
      let max = 25;
      let step = 4;
      let sum = 0;
      for (let i = min; i <= max; i += step) {
        sum += i;
      }
      let product = 1;
      for (let i = min; i <= max; i += step) {
        product *= i;
      }
      $("#product1").html(`The result of 5 * 9 * 13 * 17 * 21 * 25 is ${product.toLocaleString()}`);
      $("#sum1").html(`The result of 5 + 9 + 13 + 17 + 21 + 25 is ${sum.toLocaleString()}`);

      min = 3;
      max = 18;
      step = 3;
      sum = 0;
      let i = min;
      while (i <= max) {
        sum += i;
        i += step;
      }
      product = 1;
      i = min;
      while (i <= max) {
        product *= i;
        i += step;
      }
      $("#product2").html(`The result of 3 * 6 * 9 * 12 * 15 * 18 is ${product.toLocaleString()}`);
      $("#sum2").html(`The result of 3 + 6 + 9 + 12 + 15 + 18 is ${sum.toLocaleString()}`);
    });

  </script>
</head>

<body>
  <div id="draggable" class="ui-widget-content">
    <h1>Homework 4 - Part 1</h1>
  </div>

  <a href="hw4.html">Back</a>

  <p id="product1"></p>
  <p id="sum1"></p>
  <p id="product2"></p>
  <p id="sum2"></p>
</body>

</html>
